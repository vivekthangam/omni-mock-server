syntax = "proto3";

package omnimock.v1;

service TestService {
  // Unary RPC
  rpc UnaryEcho (EchoRequest) returns (EchoResponse);
  rpc GetUser (UserRequest) returns (UserResponse);

  // Server Streaming RPC
  rpc StreamTicks (StreamRequest) returns (stream TickResponse);
  rpc ListProducts (ProductFilter) returns (stream ProductResponse);

  // Client Streaming RPC
  rpc RecordMetrics (stream MetricRequest) returns (MetricSummaryResponse);

  // Bidirectional Streaming RPC
  rpc ChatStream (stream ChatMessage) returns (stream ChatMessage);

  // Error Simulation RPC
  rpc SimulateError (ErrorRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
  map<string, string> metadata = 2;
}

message EchoResponse {
  string message = 1;
  int64 timestamp = 2;
  map<string, string> received_metadata = 3;
}

message UserRequest {
  string user_id = 1;
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  int64 created_at = 5;
}

message StreamRequest {
  int32 count = 1;
  int32 interval_ms = 2;
}

message TickResponse {
  int32 sequence = 1;
  string event_id = 2;
  double value = 3;
  int64 timestamp = 4;
}

message MetricRequest {
  string metric_name = 1;
  double value = 2;
  int64 timestamp = 3;
}

message MetricSummaryResponse {
  int32 count = 1;
  double sum = 2;
  double average = 3;
  double min = 4;
  double max = 5;
}

message ChatMessage {
  string sender = 1;
  string content = 2;
  int64 timestamp = 3;
}

message ProductFilter {
  string category = 1;
  double max_price = 2;
  int32 limit = 3;
}

message ProductResponse {
  string id = 1;
  string title = 2;
  double price = 3;
  string category = 4;
  bool in_stock = 5;
}

message ErrorRequest {
  int32 status_code = 1; // 3: INVALID_ARGUMENT, 5: NOT_FOUND, 7: PERMISSION_DENIED, 14: UNAVAILABLE
  string error_message = 2;
}
